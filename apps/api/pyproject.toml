[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kakeivault-api"
version = "0.1.0"
description = "KakeiVault FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi[standard]>=0.115.6,<0.116",
  "uvicorn[standard]>=0.32.1,<0.33",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14.0,<1.15",
  "psycopg[binary]>=3.2.3,<4",
  "pydantic>=2.10.4,<3",
  "pydantic-settings>=2.7.0,<3",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.20",
  "boto3>=1.36.0,<2",
  "arq>=0.26.1,<0.27",
  "redis>=5.2.1,<6",
  "slowapi>=0.1.9",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "Pillow>=11.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.1",
  "ruff>=0.9.1",
  "mypy>=1.14.1",
  "types-passlib",
  "types-python-jose",
  "types-boto3",
  "factory-boy>=3.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20"]
ignore = ["ANN101", "ANN102", "ANN401", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"app/db/migrations/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing -q"

[tool.hatch.build.targets.wheel]
packages = ["app"]
